<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Converter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="halo"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
      <div class="orb orb-5"></div>
      <div class="grain"></div>
    </div>

    <main class="board">
      <header class="board-head">
        <div>
          <h1>Converter</h1>
          <p class="subtitle">Живые курсы центробанков</p>
        </div>
        <span class="clock" id="clock"></span>
      </header>

      <section class="panel">
        <div class="panel-fx" aria-hidden="true"></div>

        <div class="field field--from">
          <div class="amount-wrap">
            <span class="symbol" id="fromSymbol" aria-hidden="true"></span>
            <input
              class="amount-input"
              id="fromAmount"
              type="text"
              inputmode="decimal"
              value="100"
              aria-label="Сумма, которую отдаёте"
            />
          </div>
          <div
            class="select"
            id="fromCurrency"
            data-label="Валюта, которую отдаёте"
          ></div>
        </div>

        <div class="swap-wrap">
          <button
            class="swap-btn"
            id="swapBtn"
            type="button"
            title="Поменять местами"
            aria-label="Поменять валюты местами"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
        </div>

        <div class="field field--to">
          <div class="amount-wrap">
            <span class="symbol" id="toSymbol" aria-hidden="true"></span>
            <input
              class="amount-input"
              id="toAmount"
              type="text"
              inputmode="decimal"
              value="0"
              aria-label="Сумма, которую получаете"
            />
          </div>
          <div
            class="select"
            id="toCurrency"
            data-label="Валюта, которую получаете"
          ></div>
        </div>

        <div class="strip" id="strip">
          <span id="rateLine">курс загружается…</span>
          <span id="dateLine"></span>
        </div>
      </section>

      <div class="error" id="errorBox"></div>

      <div class="foot">
        Курсы: агрегированные данные 84 центробанков, через открытый API
        <a href="https://frankfurter.dev" target="_blank" rel="noopener"
          >Frankfurter v2</a
        >.
      </div>
    </main>

    <script src="main.js" defer></script>
  </body>
</html>
